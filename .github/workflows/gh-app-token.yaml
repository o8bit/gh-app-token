name: gh-app-token

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every event, including pull requests, so a broken change is caught
  # before anyone cuts a release. Read-only: it can neither publish an image nor
  # move a tag, whatever the branch it is running.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t gh-app-token:ci .

      - name: Run the test suite inside the built image
        run: |
          docker run --rm --entrypoint sh gh-app-token:ci \
            /usr/local/bin/gh-app-token-test.sh

      - name: Confirm the image carries no token-consuming tooling
        run: |
          docker run --rm --entrypoint sh gh-app-token:ci -c '
            for b in openssl curl jq; do
              command -v "$b" >/dev/null || { echo "MISSING: $b"; exit 1; }
            done
            for b in git php composer gh; do
              if command -v "$b" >/dev/null; then echo "unexpectedly present: $b"; exit 1; fi
            done
            echo "dependencies as intended"'

      # The composite Action runs the script directly on the runner rather than
      # through the image, so the image tests above do not cover it. This checks
      # the two things that layer adds: the token file it reports, and that every
      # account's token is masked - the mask loop silently missed the last account
      # before a trailing newline was added to its input.
      - name: Check the composite Action wiring
        env:
          GITHUB_APP_ORGS: 'org-a,org-b'
        run: |
          set -eu
          run_block=$(python3 -c "
          import yaml
          print(yaml.safe_load(open('action.yml'))['runs']['steps'][0]['run'])")

          # A fake minter, so this needs no credentials and no network.
          mkdir -p stub && cat >stub/gh-app-token <<'STUB'
          #!/bin/sh
          mkdir -p "$GITHUB_APP_TOKEN_DIR"
          for a in $(printf '%s' "$GITHUB_APP_ORGS" | tr ',' ' '); do
            printf 'tok-%s' "$a" >"$GITHUB_APP_TOKEN_DIR/$a.token"
          done
          STUB
          chmod +x stub/gh-app-token

          GITHUB_ACTION_PATH="$PWD/stub" TOKEN_DIR_INPUT="$PWD/tokens" \
            GITHUB_OUTPUT="$PWD/gh-output" \
            bash -c "$run_block" >action-log 2>&1 || { cat action-log; exit 1; }

          masks=$(grep -c '::add-mask::' action-log || true)
          if [ "$masks" -ne 2 ]; then
            echo "expected 2 masked tokens, got $masks:"; cat action-log; exit 1
          fi
          grep -q "token-dir=$PWD/tokens" gh-output || {
            echo "token-dir output missing"; cat gh-output; exit 1; }
          echo "composite action wiring as intended"

  # Split from `test` so the credentials that publish and move tags exist only on
  # a version tag. A pull request run never holds them.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the final step, to move the `v<major>` git tag that
      # composite-Action consumers pin to.
      contents: write
      # Publishing to ghcr.io/o8bit/* works with the built-in GITHUB_TOKEN only
      # because this repo is in the o8bit org, so the package namespace matches
      # the workflow's own owner.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate the tag
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # Reject anything that is not strictly digits and dots. A glob like
          # [0-9]*.[0-9]*.[0-9]* looks like it validates but does not - '*'
          # matches any characters, so 'v1.0.0; rm -rf /' passes it.
          case "$VERSION" in
            ''|*[!0-9.]*) echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1 ;;
          esac
          MINOR="${VERSION%.*}"
          MAJOR="${MINOR%.*}"
          # Require exactly three components: stripping twice must have removed
          # something each time, and the major must contain no dot of its own.
          if [ "$VERSION" = "$MINOR" ] || [ "$MINOR" = "$MAJOR" ]; then
            echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1
          fi
          case "$MAJOR" in *.*) echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1 ;; esac
          # Every component must be non-empty, or 'v..' yields an empty tag.
          PATCH="${VERSION##*.}"; SUBMINOR="${MINOR##*.}"
          if [ -z "$MAJOR" ] || [ -z "$SUBMINOR" ] || [ -z "$PATCH" ]; then
            echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1
          fi
          {
            echo "VERSION=$VERSION"; echo "MINOR=$MINOR"; echo "MAJOR=$MAJOR"
          } >>"$GITHUB_ENV"

      - name: Build the image
        run: docker build -t gh-app-token:ci .

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        run: |
          set -eu
          IMAGE=ghcr.io/o8bit/gh-app-token
          # X.Y.Z is immutable. X.Y and X move forward, so a consumer pinning
          # ":1" picks up fixes without a config change, and one pinning
          # ":1.2.3" never changes under them.
          for tag in "$VERSION" "$MINOR" "$MAJOR" latest; do
            docker tag gh-app-token:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "published $IMAGE at $VERSION, $MINOR, $MAJOR and latest"

      - name: Move the major git tag for Action consumers
        run: |
          set -eu
          # This repository is also consumed as a composite Action, and Action
          # consumers pin a git ref rather than a docker tag, so `v$MAJOR` has to
          # move with each release the same way the `$MAJOR` docker tag does.
          # Without this, `uses: o8bit/gh-app-token@v1` stays frozen at whatever
          # commit v1 first pointed at.
          git tag -f "v$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/v$MAJOR"
          echo "moved git tag v$MAJOR to $GITHUB_SHA"
