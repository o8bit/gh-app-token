name: gh-app-token

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing to ghcr.io/o8bit/* works with the built-in GITHUB_TOKEN only
      # because this repo is in the o8bit org, so the package namespace matches
      # the workflow's own owner.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t gh-app-token:ci .

      - name: Run the test suite inside the built image
        run: |
          docker run --rm --entrypoint sh gh-app-token:ci \
            /usr/local/bin/gh-app-token-test.sh

      - name: Confirm the image carries no token-consuming tooling
        run: |
          docker run --rm --entrypoint sh gh-app-token:ci -c '
            for b in openssl curl jq; do
              command -v "$b" >/dev/null || { echo "MISSING: $b"; exit 1; }
            done
            for b in git php composer gh; do
              if command -v "$b" >/dev/null; then echo "unexpectedly present: $b"; exit 1; fi
            done
            echo "dependencies as intended"'

      # Only a version tag publishes. Pushes to main and pull requests build and
      # test, so a broken change is caught before anyone cuts a release, but the
      # release itself stays deliberate.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # Reject anything that is not strictly digits and dots. A glob like
          # [0-9]*.[0-9]*.[0-9]* looks like it validates but does not - '*'
          # matches any characters, so 'v1.0.0; rm -rf /' passes it.
          case "$VERSION" in
            ''|*[!0-9.]*) echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1 ;;
          esac
          MINOR="${VERSION%.*}"
          MAJOR="${MINOR%.*}"
          # Require exactly three components: stripping twice must have removed
          # something each time, and the major must contain no dot of its own.
          if [ "$VERSION" = "$MINOR" ] || [ "$MINOR" = "$MAJOR" ]; then
            echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1
          fi
          case "$MAJOR" in *.*) echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1 ;; esac
          # Every component must be non-empty, or 'v..' yields an empty tag.
          PATCH="${VERSION##*.}"; SUBMINOR="${MINOR##*.}"
          if [ -z "$MAJOR" ] || [ -z "$SUBMINOR" ] || [ -z "$PATCH" ]; then
            echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1
          fi

          IMAGE=ghcr.io/o8bit/gh-app-token
          # X.Y.Z is immutable. X.Y and X move forward, so a consumer pinning
          # ":1" picks up fixes without a config change, and one pinning
          # ":1.2.3" never changes under them.
          for tag in "$VERSION" "$MINOR" "$MAJOR" latest; do
            docker tag gh-app-token:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "published $IMAGE at $VERSION, $MINOR, $MAJOR and latest"
